services:
  - type: web
    name: shopping-agent-api
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run check
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: METRICS_TOKEN
        sync: false
